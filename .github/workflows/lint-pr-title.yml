name: "Lint PR Title"

on:
  workflow_dispatch:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate PR commits with Commitlint
        run: |
          node <<'EOF'
          const { execSync } = require('child_process');

          const baseRef = process.env.GITHUB_BASE_REF;
          const headSha = process.env.GITHUB_SHA;

          if (!baseRef || !headSha) {
            throw new Error('Missing pull request context.');
          }

          const baseSha = execSync(`git rev-parse origin/${baseRef}`).toString().trim();
          const commits = execSync(`git rev-list ${baseSha}..${headSha}`, { encoding: 'utf8' })
            .trim()
            .split('\n')
            .filter(Boolean);

          if (commits.length === 0) {
            throw new Error('No commits found in this pull request.');
          }

          const conventionalCommit = /^([a-z]+)(\([^)]+\))?!?: .+/;
          const hasValidCommit = commits.some((sha) => {
            const message = execSync(`git log --format=%s -n 1 ${sha}`, { encoding: 'utf8' }).trim();
            return conventionalCommit.test(message);
          });

          if (!hasValidCommit) {
            throw new Error('At least one commit in this pull request must use conventional commits format.');
          }
          EOF
